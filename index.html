<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <title>战国争霸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background:
        radial-gradient(1200px 700px at 50% 28%, #2b2440 0%, #171423 55%, #0c0a14 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Noto Serif SC", "Songti SC", serif;
    }
    /* 暗纹：淡淡的回纹质感 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: repeating-linear-gradient(45deg, #ffcc00 0 2px, transparent 2px 14px),
                        repeating-linear-gradient(-45deg, #ffcc00 0 2px, transparent 2px 14px);
    }
    canvas {
      display: block;
      border-radius: 10px;
      border: 2px solid rgba(255, 204, 0, 0.35);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.7), 0 0 18px rgba(255, 204, 0, 0.12);
      max-width: 100vw;
      max-height: 100vh;
    }
    /* 加载屏 */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      background: radial-gradient(900px 600px at 50% 40%, #241f38 0%, #100d1a 70%);
      transition: opacity 0.5s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .title {
      font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
      font-size: clamp(56px, 12vw, 96px);
      color: #ffcc00;
      letter-spacing: 0.12em;
      text-shadow: 0 4px 24px rgba(255, 204, 0, 0.25);
    }
    #loading .sub {
      color: #9fb4cc;
      font-size: 15px;
      letter-spacing: 0.5em;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    /* 竖屏提示：只在触屏竖屏时出现，可点掉 */
    #rotateHint {
      display: none;
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(11, 14, 23, 0.88);
      border: 1px solid rgba(255, 204, 0, 0.6);
      color: #ffe27a;
      font-size: 13px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotateHint { display: block; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="title">战国争霸</div>
    <div class="sub">正在点兵</div>
  </div>
  <div id="rotateHint">📱 横屏游玩体验更佳（点击关闭）</div>
  <script>
    document.getElementById('rotateHint').addEventListener('click', function () {
      this.style.display = 'none';
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
